name: CI Test & Smoke Verification

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test_and_verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install System Dependencies (FFmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-color-emoji
          fc-cache -f -v

      - name: Install Node Dependencies
        run: npm ci

      - name: Environment Doctor Check
        run: npm run doctor

      - name: TypeScript Typecheck
        run: npm run typecheck

      - name: Run Vitest Unit Tests
        run: npm test

      - name: Export JSON Schemas Verification
        run: npm run schemas:export
