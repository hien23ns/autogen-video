name: Render Video 24/7 (Webhook / Repository Dispatch)

on:
  repository_dispatch:
    types: [render_video, create_video]
  workflow_dispatch:
    inputs:
      url:
        description: "Link bài viết hoặc GitHub Repo cần tạo video"
        required: true
        default: "https://github.com/facebook/react"
      chat_id:
        description: "Telegram Chat ID nhận video hoàn tất"
        required: true
      theme:
        description: "Tuỳ chọn theme (cyberpunk | matrix | sunset | crimson | dark | light)"
        required: false
        default: "cyberpunk"

jobs:
  render_and_send:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Setup Python 3
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python Edge-TTS
        run: |
          python -m pip install --upgrade pip
          pip install edge-tts

      - name: Install System Dependencies (FFmpeg & Vietnamese Fonts)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu fonts-liberation fonts-noto-color-emoji
          fc-cache -f -v

      - name: Install Node Dependencies
        run: npm ci

      - name: Install Playwright Chromium & System Libs
        run: npx playwright install --with-deps chromium

      - name: Download SFX Audio Pack
        run: npm run sfx:download

      - name: Resolve Webhook Payload Parameters
        id: payload
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_URL: ${{ github.event.client_payload.url }}
          DISPATCH_CHAT: ${{ github.event.client_payload.chat_id }}
          DISPATCH_THEME: ${{ github.event.client_payload.theme }}
          INPUT_URL: ${{ github.event.inputs.url }}
          INPUT_CHAT: ${{ github.event.inputs.chat_id }}
          INPUT_THEME: ${{ github.event.inputs.theme }}
        run: |
          if [ "$EVENT_NAME" = "repository_dispatch" ]; then
            URL="$DISPATCH_URL"
            CHAT_ID="$DISPATCH_CHAT"
            THEME="${DISPATCH_THEME:-cyberpunk}"
          else
            URL="$INPUT_URL"
            CHAT_ID="$INPUT_CHAT"
            THEME="${INPUT_THEME:-cyberpunk}"
          fi

          if [ -z "$URL" ]; then
            echo "::error::Thiếu tham số 'url' trong payload!"
            exit 1
          fi

          if [ -z "$CHAT_ID" ]; then
            echo "::error::Thiếu tham số 'chat_id' trong payload!"
            exit 1
          fi

          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "chat_id=$CHAT_ID" >> "$GITHUB_OUTPUT"
          echo "theme=$THEME" >> "$GITHUB_OUTPUT"
          echo "Rendering URL: $URL | Theme: $THEME | Telegram Chat ID: $CHAT_ID"

      - name: Run Video Generation Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TTS_PROVIDER: edge-tts
          EDGE_TTS_VOICE: vi-VN-NamMinhNeural
          EDGE_TTS_RATE: "+16%"
          TIKTOK_DISPLAY_NAME: "Code Suy 24h 🔱"
          TIKTOK_HANDLE: "@codesuy24h"
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
          SOURCE_URL: ${{ steps.payload.outputs.url }}
          VIDEO_THEME: ${{ steps.payload.outputs.theme }}
        run: |
          mkdir -p output
          npx tsx src/cli.ts \
            --url "$SOURCE_URL" \
            --output "output/video.mp4" \
            --theme "$VIDEO_THEME"

      - name: Send Video to Telegram via Bot API
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ steps.payload.outputs.chat_id }}
          SOURCE_URL: ${{ steps.payload.outputs.url }}
        run: |
          echo "Sending video to Telegram chat $CHAT_ID..."
          CAPTION=$(printf '🎬 Video tin tức công nghệ đã render thành công!\n🔗 Nguồn: %s\n✨ Kênh: Code Suy 24h 🔱 (@codesuy24h)' "$SOURCE_URL")

          RESPONSE=$(curl -s -S -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendVideo" \
            -F "chat_id=${CHAT_ID}" \
            -F "video=@output/video.mp4" \
            --form-string "caption=${CAPTION}" \
            -F "supports_streaming=true")

          echo "Telegram API Response: $RESPONSE"

          if echo "$RESPONSE" | grep -q '"ok":true'; then
            echo "Gửi video về Telegram thành công!"
          else
            echo "::error::Gửi video về Telegram thất bại: $RESPONSE"
            exit 1
          fi

      - name: Upload Output Video as Run Artifact (Backup)
        if: always() && hashFiles('output/video.mp4') != ''
        uses: actions/upload-artifact@v4
        with:
          name: generated-video
          path: output/video.mp4
          retention-days: 7